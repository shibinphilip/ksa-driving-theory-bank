<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>html{color-scheme:light dark}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Saudi Driving Theory Bank</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap">
<style>
:root{
  --paper:#FBFAF7; --surface:#FFFFFF; --surface-2:#F3F1EB; --plate:#FFFFFF;
  --ink:#17211C; --ink-2:#4A574F; --ink-3:#7E8A82;
  --line:#E3DFD6; --line-2:#CCC7BA;
  --green:#0B7A3E; --green-ink:#0A6A37; --green-soft:#EAF4EE; --green-line:#9ECFB4;
  --red:#B8172A; --red-soft:#FAEAEC; --red-line:#E3A9B1;
  --blue:#14549B;
  --on-green:#FFFFFF;
  --shadow:0 1px 2px rgba(23,33,28,.06);
}
:root:not([data-theme="light"]){color-scheme:light dark}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0F1411; --surface:#161D18; --surface-2:#1D2620; --plate:#F2F2EF;
    --ink:#E9EDE8; --ink-2:#AFB9B1; --ink-3:#7F8B83;
    --line:#2A342D; --line-2:#3C4840;
    --green:#4CC684; --green-ink:#63D294; --green-soft:#12291D; --green-line:#2E6B47;
    --red:#EF8391; --red-soft:#2C161A; --red-line:#6A3038;
    --blue:#6FA8E6;
    --on-green:#0F1411;
    --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#0F1411; --surface:#161D18; --surface-2:#1D2620; --plate:#F2F2EF;
  --ink:#E9EDE8; --ink-2:#AFB9B1; --ink-3:#7F8B83;
  --line:#2A342D; --line-2:#3C4840;
  --green:#4CC684; --green-ink:#63D294; --green-soft:#12291D; --green-line:#2E6B47;
  --red:#EF8391; --red-soft:#2C161A; --red-line:#6A3038;
  --blue:#6FA8E6;
  --on-green:#0F1411;
  --shadow:0 1px 2px rgba(0,0,0,.4);
}

*{box-sizing:border-box}
body{
  background:var(--paper); color:var(--ink);
  font-family:"Source Sans 3",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:16.5px; line-height:1.5; margin:0;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:"Familjen Grotesk","Source Sans 3",sans-serif;text-wrap:balance;margin:0}
.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace}

/* ---------- masthead ---------- */
.masthead{border-bottom:1px solid var(--line);background:var(--surface)}
.masthead-in{max-width:1180px;margin:0 auto;padding-block:26px 22px;padding-inline:20px;
  display:flex;flex-wrap:wrap;gap:18px 28px;align-items:flex-end;justify-content:space-between}
.brandmark{display:flex;gap:14px;align-items:center}
.lamp{width:26px;border:2px solid var(--ink);border-radius:7px;padding:3px 0;display:grid;gap:3px;justify-items:center;flex:none}
.lamp i{width:12px;height:12px;border-radius:50%;display:block}
.lamp i:nth-child(1){background:#D8262F}
.lamp i:nth-child(2){background:#E9A100}
.lamp i:nth-child(3){background:var(--green)}
h1{font-size:clamp(1.45rem,1.1rem + 1.5vw,2.05rem);font-weight:700;letter-spacing:-.018em;line-height:1.1}
.kicker{font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-weight:600;display:block;margin-bottom:5px}
.tally{display:flex;gap:22px;font-size:.82rem;color:var(--ink-2)}
.tally b{display:block;font-family:"Familjen Grotesk",sans-serif;font-size:1.35rem;font-weight:700;color:var(--ink);line-height:1.1;font-variant-numeric:tabular-nums}
.tally span{font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);font-weight:600}

/* ---------- toolbar ---------- */
.toolbar{position:sticky;top:0;z-index:30;background:var(--paper);border-bottom:1px solid var(--line)}
.toolbar-in{max-width:1180px;margin:0 auto;padding-block:11px;padding-inline:20px;
  display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.search{flex:1 1 210px;min-width:0;position:relative}
.search input{width:100%;font:inherit;font-size:.92rem;color:var(--ink);background:var(--surface);
  border:1px solid var(--line-2);border-radius:7px;padding:7px 11px 7px 32px}
.search input::placeholder{color:var(--ink-3)}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--ink-3)}
.seg{display:flex;border:1px solid var(--line-2);border-radius:7px;overflow:hidden;background:var(--surface);flex:none}
.seg button{font:inherit;font-size:.82rem;font-weight:600;color:var(--ink-2);background:none;border:0;
  padding:7px 13px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--green);color:var(--on-green)}
.hitcount{font-size:.8rem;color:var(--ink-3);white-space:nowrap}

/* ---------- shell ---------- */
.shell{max-width:1180px;margin:0 auto;padding-inline:20px;display:grid;
  grid-template-columns:212px minmax(0,1fr);gap:40px;align-items:start}
nav.units{position:sticky;top:64px;padding-block:28px;display:flex;flex-direction:column;gap:1px}
nav.units a{display:grid;grid-template-columns:30px 1fr auto;gap:8px;align-items:baseline;
  text-decoration:none;color:var(--ink-2);padding:6px 8px;border-radius:6px;font-size:.855rem;line-height:1.25}
nav.units a:hover{background:var(--surface-2);color:var(--ink)}
nav.units a .rn{font-family:"IBM Plex Mono",monospace;font-size:.72rem;font-weight:600;color:var(--red)}
nav.units a .ct{font-family:"IBM Plex Mono",monospace;font-size:.7rem;color:var(--ink-3);font-variant-numeric:tabular-nums}
nav.units .navhead{font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);
  font-weight:600;padding:0 8px 8px}

main{padding-block:28px 80px;min-width:0}

/* ---------- unit heading ---------- */
.unit{scroll-margin-top:62px}
.unit+.unit{margin-top:52px}
.unit-head{display:flex;gap:14px;align-items:baseline;padding-bottom:12px;
  border-bottom:2px solid var(--ink);margin-bottom:8px}
.unit-head .rn{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:.82rem;color:var(--red);
  border:1px solid var(--red-line);background:var(--red-soft);border-radius:4px;padding:2px 7px;flex:none}
.unit-head h2{font-size:1.3rem;font-weight:700;letter-spacing:-.01em;flex:1 1 auto;min-width:0}
.unit-head .ct{font-family:"IBM Plex Mono",monospace;font-size:.72rem;color:var(--ink-3);white-space:nowrap}

/* ---------- question ---------- */
.q{display:grid;grid-template-columns:44px minmax(0,1fr);gap:0 14px;
  padding-block:22px;border-bottom:1px solid var(--line)}
.q-no{font-family:"IBM Plex Mono",monospace;font-size:.82rem;font-weight:600;color:var(--ink-3);
  font-variant-numeric:tabular-nums;padding-top:2px}
.q-body{min-width:0;display:flex;flex-direction:column;gap:12px}
.q-text{font-size:1.02rem;font-weight:600;line-height:1.42;color:var(--ink);margin:0;max-width:64ch}
.plate{background:var(--plate);border:1px solid var(--line-2);border-radius:8px;padding:12px;
  align-self:flex-start;max-width:100%;box-shadow:var(--shadow)}
.plate img{display:block;max-width:100%;height:auto;max-height:260px}

ol.opts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px;max-width:70ch}
ol.opts li{display:grid;grid-template-columns:22px 1fr;gap:9px;align-items:start;
  padding:5px 9px 5px 7px;border-left:3px solid transparent;border-radius:0 5px 5px 0;
  font-size:.95rem;color:var(--ink-2);line-height:1.42}
ol.opts .ltr{font-family:"IBM Plex Mono",monospace;font-size:.8rem;font-weight:600;color:var(--ink-3);padding-top:2px}
ol.opts .otxt{display:flex;flex-wrap:wrap;gap:8px;align-items:center;min-width:0}
ol.opts .otxt img{max-height:56px;width:auto;background:var(--plate);border:1px solid var(--line-2);
  border-radius:5px;padding:4px}

/* correct answer */
.reveal .correct{background:var(--green-soft);border-left-color:var(--green);color:var(--green-ink);font-weight:600}
.reveal .correct .ltr{color:var(--green);font-weight:600}
.reveal .correct .otxt::after,
.q.answered .correct .otxt::after{content:"\2713";color:var(--green);font-weight:700;margin-left:2px}
.answerline{display:none;font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;font-weight:600;
  color:var(--green);align-items:center;gap:7px}
.reveal .answerline{display:flex}
.answerline .dot{width:7px;height:7px;border-radius:50%;background:var(--green);flex:none}

/* quiz mode */
.quiz ol.opts li{cursor:pointer;transition:background .12s}
.quiz ol.opts li:hover{background:var(--surface-2)}
.q.answered.quiz ol.opts li{cursor:default}
.q.answered .correct{background:var(--green-soft);border-left-color:var(--green);color:var(--green-ink);font-weight:600}
.q.answered .correct .ltr{color:var(--green)}
.q.answered .picked-wrong{background:var(--red-soft);border-left-color:var(--red);color:var(--red);text-decoration:line-through}
.q.answered .picked-wrong .ltr{color:var(--red);text-decoration:none}
.q.answered .answerline{display:flex}

.empty{padding:60px 0;color:var(--ink-3);font-size:.95rem}
.hidden{display:none !important}

footer{border-top:1px solid var(--line);background:var(--surface)}
.foot-in{max-width:1180px;margin:0 auto;padding-block:22px 34px;padding-inline:20px;
  font-size:.8rem;color:var(--ink-3);display:flex;flex-wrap:wrap;gap:6px 18px}

:focus-visible{outline:2px solid var(--green);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}

@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr);gap:0}
  nav.units{position:static;flex-direction:row;overflow-x:auto;gap:6px;padding-block:14px 4px;
    scrollbar-width:none;border-bottom:1px solid var(--line)}
  nav.units::-webkit-scrollbar{display:none}
  nav.units .navhead{display:none}
  nav.units a{grid-template-columns:auto auto;white-space:nowrap;border:1px solid var(--line-2);
    background:var(--surface);padding:6px 11px;gap:7px}
  nav.units a .ct{display:none}
  .unit{scroll-margin-top:56px}
}
@media (max-width:520px){
  body{font-size:16px}
  .q{grid-template-columns:minmax(0,1fr);gap:8px}
  .q-no{padding-top:0}
  .masthead-in{padding-block:20px 18px}
  .tally{gap:16px}
}
</style>
</head>
<body>
<header class="masthead">
  <div class="masthead-in">
    <div class="brandmark">
      <div class="lamp" aria-hidden="true"><i></i><i></i><i></i></div>
      <div>
        <span class="kicker">Handbook for Driving Student &middot; KSA</span>
        <h1>Example Test Questions</h1>
      </div>
    </div>
    <div class="tally">
      <div><b>195</b><span>Questions</span></div>
      <div><b>8</b><span>Units</span></div>
      <div><b>70</b><span>Sign plates</span></div>
    </div>
  </div>
</header>

<div class="toolbar">
  <div class="toolbar-in">
    <label class="search">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="7" cy="7" r="4.6"/><path d="M10.5 10.5 14 14"/></svg>
      <input id="q-search" type="search" placeholder="Search questions and answers&#8230;" autocomplete="off">
    </label>
    <div class="seg" role="group" aria-label="Answer display">
      <button type="button" id="mode-study" aria-pressed="true">Answers shown</button>
      <button type="button" id="mode-quiz" aria-pressed="false">Quiz me</button>
    </div>
    <span class="hitcount" id="hitcount">195 questions</span>
  </div>
</div>

<div class="shell">
  <nav class="units" id="unitnav" aria-label="Units"></nav>
  <main id="stream"></main>
</div>

<footer>
  <div class="foot-in">
    <span>Every example test question from Units I&#8211;VIII, with the answer key from the back of the handbook applied to each question.</span>
    <span>Correct answers are marked in green.</span>
  </div>
</footer>

<script>
const UNITS = [

  {n:8, rn:"VIII", name:"General Behavior"}

const QUESTIONS = [{"unit": 1, "n": 1, "q": "How many persons, including the driver, are you permitted to transport in a vehicle if you have a private driver\u2019s license?", "opts": [["a", "Not more than 5 persons"], ["b", "Not more than 9 persons"], ["c", "Not more than 12 persons"], ["d", "Not more than 7 persons"]], "answer": "b"}, {"unit": 1, "n": 2, "q": "With the private driver\u2019s license, you are allowed to drive private transport vehicles which do not exceed the total weight of \u2026", "opts": [["a", "7500 kg"], ["b", "5000 kg"], ["c", "3500 kg"], ["d", "2000 kg"]], "answer": "c"}, {"unit": 1, "n": 3, "q": "How long does it take to react to an unexpected situation?", "opts": [["a", "Approximately one minute"], ["b", "Approximately 20 seconds"], ["c", "Approximately 1 second"], ["d", "Approximately 1/10 of a second"]], "answer": "c"}, {"unit": 1, "n": 4, "q": "You are driving with 60 km/h. How many meters do you drive in one second?", "opts": [["a", "Approximately 2 meters"], ["b", "Approximately 12 meters"], ["c", "Approximately 18 meters"], ["d", "Approximately 36 meters"]], "answer": "c"}, {"unit": 1, "n": 5, "q": "You are driving with 30 km/h. How many meters do you drive in one second?", "opts": [["a", "Approximately 2 meters"], ["b", "Approximately 9 meters"], ["c", "Approximately 18 meters"], ["d", "Approximately 25 meters"]], "answer": "b"}, {"unit": 1, "n": 6, "q": "The definition of the Reaction Distance (thinking distance) is:", "opts": [["a", "The distance that is covered from the moment a driver detects a hazard until the brake is applied"], ["b", "The distance that is covered from the moment a driver detects a hazard until the car stops (stands still)."], ["c", "The distance that is covered from the moment a driver applies the brake until the car stops (stands still)."], ["d", "The distance that is covered from the moment a driver applies the brake until a hazard is detected."]], "answer": "a"}, {"unit": 1, "n": 7, "q": "The definition of the Braking Distance is:", "opts": [["a", "The distance that is covered from the moment a driver detects a hazard until the brake is applied"], ["b", "The distance that is covered from the moment a driver detects a hazard until the car stops (stands still)."], ["c", "The distance that is covered from the moment a driver applies the brake until the car stops (stands still)."], ["d", "The distance that is covered from the moment a driver applies the brake until a hazard is detected."]], "answer": "c"}, {"unit": 1, "n": 8, "q": "The definition of the Stopping Distance is:", "opts": [["a", "The distance that is covered from the moment a driver detects a hazard until the brake is applied"], ["b", "The distance that is covered from the moment a driver detects a hazard until the car stops (stands still)."], ["c", "The distance that is covered from the moment a driver applies the brake until the car stops (stands still)."], ["d", "The distance that is covered from the moment a driver applies the brake until a hazard is detected."]], "answer": "b"}, {"unit": 1, "n": 9, "q": "How do you calculate the Braking Distance?", "opts": [["a", "(Speed/3) x (Speed/10)"], ["b", "(Speed/10) x 3"], ["c", "(Speed/10) x (Speed/10)"], ["d", "(Speed/7) x (Speed/3)"]], "answer": "c"}, {"unit": 1, "n": 10, "q": "How do you calculate the Reaction Distance?", "opts": [["a", "(Speed/7) x 10"], ["b", "(Speed/10) x (Speed/10)"], ["c", "(Speed/3) x 10"], ["d", "(Speed/10) x 3"]], "answer": "d"}, {"unit": 1, "n": 11, "q": "When does the Reaction Distance become longer?", "opts": [["a", "At increased driving speed"], ["b", "When distracted or tired"], ["c", "Under the influence of drugs or alcohol"], ["d", "All of the above"]], "answer": "d"}, {"unit": 1, "n": 12, "q": "When does the Braking Distance become longer?", "opts": [["a", "At increased driving speed"], ["b", "When distracted or tired"], ["c", "Under the influence of drugs or alcohol"], ["d", "All of the above"]], "answer": "a"}, {"unit": 1, "n": 13, "q": "How can you reduce the Reaction Distance?", "opts": [["a", "Increase the driving speed"], ["b", "Hear music that keeps you awake"], ["c", "Check the tire pressure regularly"], ["d", "Keep your foot over the braking pedal without braking"]], "answer": "d"}, {"unit": 1, "n": 14, "q": "How can you reduce the Stopping Distance?", "opts": [["a", "Increase speed, increase attention, be prepared to brake, keep your foot over the braking pedal without braking"], ["b", "Reduce speed, increase attention, keep your foot on the braking pedal and brake lightly while driving"], ["c", "Reduce speed, increase attention, be prepared to brake, keep your foot over the braking pedal without braking"], ["d", "Reduce speed, check your tires, be prepared to brake"]], "answer": "c"}, {"unit": 1, "n": 15, "q": "You drive with 50 km/h at good weather conditions. If you recognize a situation where you have to brake, which distance will you cover before you come to a stop? (How long will your stopping distance be?)", "opts": [["a", "Approximately 15m"], ["b", "Approximately 40m"], ["c", "Approximately 64m"], ["d", "Approximately 90m"]], "answer": "b"}, {"unit": 1, "n": 16, "q": "What must a driver who is involved in a traffic accident do?", "opts": [["a", "Stop the vehicle at the scene of the accident and inform the relevant d debarment"], ["b", "Take the necessary safety measures to secure the accident scene until the Traffic Police arrives"], ["c", "Provide possible assistance to the victims of the accident"], ["d", "All of the above"]], "answer": "d"}, {"unit": 1, "n": 17, "q": "Which one is an example of a Category 1 Violation?", "opts": [["a", "Driving at such a slow speed as to impede or block the flow of traffic"], ["b", "Exceeding the speed limit by more than 25 km/h"], ["c", "Driving with an expired Driver\u2019s License"], ["d", "None of the above"]], "answer": "b"}, {"unit": 1, "n": 18, "q": "Which is NOT a violation listed in the violation point system?", "opts": [[" , ["d", "You run out of fuel \u2013 drive to the next petrol station"]], "answer": "b"}, {"unit": 8, "n": 28, "q": "What can you do to defog the front window?", "opts": [["a", "Direct the air fan to the window"], ["b", "Use the highest intensity of the fan"], ["c", "Switch on the air conditioner"], ["d", "All of the above"]], "answer": "d"}];

const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const nav = document.getElementById("unitnav");
const stream = document.getElementById("stream");

let navHTML = '<div class="navhead">Units</div>';
let streamHTML = "";

for (const u of UNITS) {
  const qs = QUESTIONS.filter(q => q.unit === u.n);
  navHTML += `<a href="#unit-${u.n}"><span class="rn">${u.rn}</span><span class="nm">${esc(u.name)}</span><span class="ct">${qs.length}</span></a>`;

  let body = "";
  for (const q of qs) {
    const plate = q.img
      ? `<div class="plate"><img src="${q.img}" alt="Figure for unit ${u.n} question ${q.n}" loading="lazy"></div>` : "";
    let opts = "";
    for (const [ltr, txt] of q.opts) {
      const im = q.optImg && q.optImg[ltr]
        ? `<img src="${q.optImg[ltr]}" alt="Sign for option ${ltr}" loading="lazy">` : "";
      const cls = ltr === q.answer ? ' class="correct"' : "";
      opts += `<li${cls} data-ltr="${ltr}"><span class="ltr">${ltr}.</span><span class="otxt">${im}${txt ? esc(txt) : ""}</span></li>`;
    }
    body += `<article class="q reveal" id="u${u.n}q${q.n}" data-answer="${q.answer}">`
      + `<div class="q-no">${u.rn}.${q.n}</div>`
      + `<div class="q-body"><p class="q-text">${esc(q.q)}</p>${plate}`
      + `<ol class="opts">${opts}</ol>`
      + `<div class="answerline"><span class="dot"></span>Correct answer &mdash; ${q.answer}</div>`
      + `</div></article>`;
  }

  streamHTML += `<section class="unit" id="unit-${u.n}">`
    + `<div class="unit-head"><span class="rn">Unit ${u.rn}</span><h2>${esc(u.name)}</h2>`
    + `<span class="ct">${qs.length} questions</span></div>${body}</section>`;
}
streamHTML += '<p class="empty hidden" id="noresult">No question matches that search.</p>';

nav.innerHTML = navHTML;
stream.innerHTML = streamHTML;

/* ---- quiz / study mode ---- */
const btnStudy = document.getElementById("mode-study");
const btnQuiz  = document.getElementById("mode-quiz");
const allQ = [...document.querySelectorAll(".q")];

function setMode(quiz) {
  btnStudy.setAttribute("aria-pressed", String(!quiz));
  btnQuiz.setAttribute("aria-pressed", String(quiz));
  for (const el of allQ) {
    el.classList.toggle("reveal", !quiz);
    el.classList.toggle("quiz", quiz);
    if (quiz) el.classList.remove("answered");
  }
}
btnStudy.addEventListener("click", () => setMode(false));
btnQuiz.addEventListener("click", () => setMode(true));

stream.addEventListener("click", e => {
  const li = e.target.closest("ol.opts li");
  if (!li) return;
  const q = li.closest(".q");
  if (!q || !q.classList.contains("quiz") || q.classList.contains("answered")) return;
  q.classList.add("answered");
  if (li.dataset.ltr !== q.dataset.answer) li.classList.add("picked-wrong");
});

/* ---- search ---- */
const input = document.getElementById("q-search");
const hit = document.getElementById("hitcount");
const noresult = document.getElementById("noresult");
const haystack = QUESTIONS.map(q => (q.q + " " + q.opts.map(o => o[1]).join(" ")).toLowerCase());

input.addEventListener("input", () => {
  const term = input.value.trim().toLowerCase();
  let shown = 0;
  allQ.forEach((el, i) => {
    const ok = !term || haystack[i].includes(term);
    el.classList.toggle("hidden", !ok);
    if (ok) shown++;
  });
  for (const sec of document.querySelectorAll(".unit")) {
    const any = sec.querySelector(".q:not(.hidden)");
    sec.classList.toggle("hidden", !any);
  }
  noresult.classList.toggle("hidden", shown > 0);
  hit.textContent = term ? `${shown} of 195 questions` : "195 questions";
});
</script>
